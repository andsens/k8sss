version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  # The step-ca client pulls in over a hundred indirect dependencies, so
  # ungrouped bumps would open a flood of pull requests every week. Minor and
  # patch updates arrive as one; majors stay on their own, where the
  # auto-merge workflow leaves them for review.
  groups:
    go:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly

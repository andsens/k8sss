name: Dependabot auto-merge

# Dependabot pull requests run with read-only default permissions, so this
# needs its own workflow with elevated permissions rather than a step tacked
# onto test.yaml - see GitHub's docs on automating Dependabot:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Who opened the pull request, rather than whoever triggered this run.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
    - name: Fetch Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    # This only *enables* GitHub's native auto-merge, which then waits for the
    # required status checks on whatever the head commit ends up being - which
    # may be a commit pins.yaml added. That needs "Allow auto-merge"
    # turned on for the repository and the `go`, `lint` and `nix` jobs from
    # test.yaml set as required checks on main, or it is a no-op. Major bumps
    # are left alone, being the ones likely to carry breaking changes.
    #
    # The merge runs under a personal access token because GITHUB_TOKEN has no
    # permission that covers workflow files - there is no `workflows` key to
    # grant - so it cannot merge the github-actions bumps, whose whole content
    # is a change under .github/workflows. The token lives in Dependabot
    # secrets, since these runs cannot read Actions secrets.
    - name: Enable auto-merge for patch and minor updates
      if: steps.metadata.outputs.update-type != 'version-update:semver-major'
      run: gh pr merge --auto --squash "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}

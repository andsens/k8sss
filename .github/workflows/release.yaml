name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  build-bootstrap:
    uses: ./.github/workflows/build-bootstrap.yaml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    secrets: inherit

  # The binary is named for the `uname -s`/`uname -m` of the machine it is
  # meant for, which is what the upkg manifest below selects on.
  #
  # cgo means Linux has to build on a runner of its own architecture. macOS
  # ships a universal toolchain, so one runner covers both architectures; the
  # -arch flag is passed for each of them rather than only for the one being
  # cross compiled, which keeps this working whichever architecture the runner
  # itself happens to be.
  build:
    strategy:
      matrix:
        include:
        - runner: ubuntu-latest
          target: Linux-x86_64
          goarch: amd64
        - runner: ubuntu-24.04-arm
          target: Linux-aarch64
          goarch: arm64
        - runner: macos-15
          target: Darwin-arm64
          goarch: arm64
          cgoarch: -arch arm64
        - runner: macos-15
          target: Darwin-x86_64
          goarch: amd64
          cgoarch: -arch x86_64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Install pcsclite
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
    - name: Build
      env:
        CGO_ENABLED: "1"
        GOARCH: ${{ matrix.goarch }}
        CGO_CFLAGS: ${{ matrix.cgoarch }}
        CGO_LDFLAGS: ${{ matrix.cgoarch }}
      run: go build -trimpath -ldflags=-s -o "k8sss-${{ matrix.target }}" .
    - name: Check that the binary is for the right architecture
      run: file "k8sss-${{ matrix.target }}"
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: k8sss-${{ matrix.target }}
        path: k8sss-${{ matrix.target }}
        if-no-files-found: error

  release:
    needs: [test, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Create GitHub release
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    # One manifest covers every platform: upkg installs only the dependency
    # whose os/arch matches the machine, so a single install string works
    # everywhere.
    - name: Build the upkg manifest
      run: |
        base="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
        for binary in dist/k8sss-*; do
          name=$(basename "$binary")
          os_arch=${name#k8sss-}
          jq -n \
            --arg file "$base/$name" \
            --arg sha256 "$(sha256sum "$binary" | cut -d' ' -f1)" \
            --arg os_arch "${os_arch%%-*}/${os_arch#*-}" \
            '{file: $file, sha256: $sha256, name: "k8sss", "os/arch": $os_arch}'
        done | jq -s \
          --arg version "${{ github.ref_name }}" \
          '{
            "$schema": "https://schemas.orbit.dev/upkg/upkg-v0.31.1.schema.json",
            name: "k8sss",
            version: $version,
            bin: [".upkg/k8sss"],
            dependencies: .
          }' > k8sss.upkg.json
        cat k8sss.upkg.json
    - name: Create the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        manifest_sha=$(sha256sum k8sss.upkg.json | cut -d' ' -f1)
        {
          echo "## Installation"
          echo
          echo '```'
          echo "upkg add -g '${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/k8sss.upkg.json' $manifest_sha"
          echo '```'
          echo
          echo "The Linux binaries link against pcsc-lite for YubiKey and PKCS#11"
          echo "support, so they need \`libpcsclite1\` (Debian and Ubuntu) or"
          echo "\`pcsc-lite\` installed even when authenticating with an SSH agent"
          echo "or TPM key. macOS needs nothing extra."
        } > notes.md
        gh release create "${{ github.ref_name }}" \
          --title "${{ github.ref_name }}" \
          --notes-file notes.md \
          k8sss.upkg.json dist/k8sss-*

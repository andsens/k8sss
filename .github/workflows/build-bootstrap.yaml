name: Build utilities image

on:
  # ** rather than *, since a single * does not match the slashes in the
  # branch names Dependabot opens - so a bumped base image was never built.
  push:
    branches: ['**']
    paths:
    - .github/workflows/build-bootstrap.yaml
    - bootstrap.Dockerfile
  workflow_call: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
    - name: Checkout the repo
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to ghcr
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Compute metadata
      id: meta
      uses: docker/metadata-action@818d4b7b91585d195f67373fd9cb0332e31a7175 # v4.6.0
      with:
        images: ghcr.io/andsens/k8sss-bootstrap
        tags: |
          type=sha
          type=semver,pattern={{version}}
    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        file: bootstrap.Dockerfile
        platforms: linux/amd64,linux/arm64
        provenance: false
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: |
          org.opencontainers.image.description="Utility image for bootstrapping the k8sss configuration"

name: Pins

# Dependabot cannot know that a Go bump moves the vendor hash flake.nix pins,
# nor that a base image bump moves the image the module pins, so both are put
# right on the branch before the pull request is merged.
on:
  push:
    branches: ['dependabot/**']

permissions:
  contents: read

jobs:
  # Computing the hash runs the actions this very branch may have bumped, so it
  # happens in a job of its own that never sees the token the push needs.
  vendor-hash:
    runs-on: ubuntu-latest
    # The push below matches this workflow's own trigger, so without this the
    # workflow would run a second time under a human actor - finding nothing to
    # do, but also unable to read the token, which only Dependabot events can
    # reach.
    if: github.actor == 'dependabot[bot]'
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
    - name: Checkout the branch
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ github.ref_name }}
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        extra_nix_config: experimental-features = nix-command flakes
    - name: Compute the vendor hash
      id: hash
      run: |
        go mod vendor
        echo "hash=$(nix hash path --type sha256 --sri vendor)" >>"$GITHUB_OUTPUT"

  pins:
    needs: vendor-hash
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the branch
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ github.ref_name }}
        # Deep, so the branch can be compared against main below.
        fetch-depth: 0
        # A push made with the default GITHUB_TOKEN starts no workflow runs, so
        # the commit below would carry no checks and auto-merge would wait on
        # them forever. A personal access token does start them.
        #
        # It has to live in Dependabot secrets rather than Actions secrets:
        # runs triggered by Dependabot are treated as though they came from a
        # fork and cannot read the latter.
        #
        # It stays in .git/config for the push, so no other action may run in
        # this job.
        token: ${{ secrets.AUTOMERGE_TOKEN }}
    - name: Update the pins
      env:
        VENDOR_HASH: ${{ needs.vendor-hash.outputs.hash }}
      run: |
        # It comes from a job running third-party code, so only a well-formed
        # hash goes into flake.nix.
        [[ $VENDOR_HASH =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]] || {
          echo "not a vendor hash: '$VENDOR_HASH'"
          exit 1
        }
        sed -i "s|vendorHash = \"sha256-[^\"]*\"|vendorHash = \"$VENDOR_HASH\"|" flake.nix
        # Catches the pattern going stale, which would otherwise be
        # indistinguishable from there being nothing to do.
        grep -qF "vendorHash = \"$VENDOR_HASH\"" flake.nix

        # Only when this branch changes the Dockerfile does
        # build-bootstrap.yaml publish an image for this commit, tagged with
        # its short sha. The tag is known in advance, so the pin can be written
        # without waiting for that build - and if the build fails the checks
        # fail and nothing merges. Pinning on any other bump would name a tag
        # that never gets built.
        if ! git diff --quiet origin/main -- bootstrap.Dockerfile; then
          # $GITHUB_SHA, which is what metadata-action derives the tag from
          # in build-bootstrap.yaml, so both name the same image. Deriving it
          # any other way can diverge: the head of a push is what gets built,
          # not necessarily the commit that touched the Dockerfile.
          image="ghcr.io/andsens/k8sss-bootstrap:sha-${GITHUB_SHA:0:7}"
          sed -i "s|ghcr.io/andsens/k8sss-bootstrap:[^\"]*|$image|" nix/modules/default/default.nix
          grep -qF "\"$image\"" nix/modules/default/default.nix
        fi

        # The module and the deployment manifest name the same step-ca, but
        # only the manifest sits where Dependabot can see it, so the module
        # follows whatever the manifest says.
        stepca=$(grep -o 'smallstep/step-ca:[^[:space:]]*' deploy/base/deployment.yaml | head -1)
        sed -i "s|smallstep/step-ca:[^\"]*|$stepca|" nix/modules/default/default.nix
        grep -qF "\"$stepca\"" nix/modules/default/default.nix

        git diff --quiet && { echo "the pins are already current"; exit 0; }
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'Update the pins for the bumped dependencies' \
          flake.nix nix/modules/default/default.nix
        git push

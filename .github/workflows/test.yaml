name: Test

on:
  # ** rather than *, so pushes to branches with a slash in the name - which
  # is every branch Dependabot opens - are tested too.
  push:
    branches: ['**']
    tags: ['!v*']
  workflow_call: {}
  # So the checks can be re-run by hand.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    # The YubiKey and PKCS#11 backends are cgo and need the smart card library
    # to build. Everything else in the binary is pure Go.
    - name: Install pcsclite
      run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test -race ./...
    - name: Build
      run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
      env:
        SHELLCHECK_OPTS: -x

  nix:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        extra_nix_config: experimental-features = nix-command flakes
    # Building the flake package is also the only check that the vendorHash it
    # pins still matches go.mod and go.sum.
    - name: Build the package
      run: nix build --print-build-logs .#k8sss

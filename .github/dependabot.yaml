version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  # The step-ca client pulls in over a hundred indirect dependencies, so
  # ungrouped bumps would open a flood of pull requests every week. Minor and
  # patch updates arrive as one; majors stay on their own.
  groups:
    go:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  ignore:
  # 0.92 changed its jose API; smallstep/certificates v0.30.2 and
  # smallstep/cli v0.31.0 still use the old one. Drop this once both have
  # releases on 0.92 or later
  - dependency-name: go.step.sm/crypto
    versions: ['>= 0.92']
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: nix
  directory: /
  schedule:
    interval: weekly
# The docker ecosystem reads Dockerfiles and Kubernetes manifests, but only
# those sitting directly in the given directory - it does not recurse - so the
# deployment needs an entry of its own.
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: docker
  directory: /deploy/base
  schedule:
    interval: weekly

name: Test

on:
  # ** rather than *, so pushes to branches with a slash in the name - which
  # is every branch Dependabot opens - are tested too.
  push:
    branches: ['**']
    tags: ['!v*']
  workflow_call: {}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    # The YubiKey and PKCS#11 backends are cgo and need the smart card library
    # to build. Everything else in the binary is pure Go.
    - name: Install pcsclite
      run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test -race ./...
    - name: Build
      run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
      env:
        SHELLCHECK_OPTS: -x

  nix:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: experimental-features = nix-command flakes
    # Building the flake package is also the only check that the vendorHash it
    # pins still matches go.mod and go.sum.
    - name: Build the package
      run: nix build --print-build-logs .#k8sss
